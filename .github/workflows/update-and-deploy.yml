name: Weekly Izuru Soba Update Check

on:
  schedule:
    # 毎週月曜日 午前9時（日本時間）
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "izuru-soba-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: pip install requests beautifulsoup4

      - name: Check official shop pages
        run: python scripts/check_updates.py

      - name: Save update status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-state.json data/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly Izuru Soba update check"
            git push
          fi
      - name: Add update status to NAVI
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          index = Path("index.html")
          status_file = Path("data/update-status.json")

          html = index.read_text(encoding="utf-8")

          # 前回自動挿入した表示があれば削除
          html = re.sub(
              r'<!-- AUTO-UPDATE-STATUS:START -->.*?<!-- AUTO-UPDATE-STATUS:END -->',
              '',
              html,
              flags=re.S
          )

          if status_file.exists():
              data = json.loads(status_file.read_text(encoding="utf-8"))
          else:
              data = {"last_checked": "未実施", "shops": {}}

          checked = data.get("last_checked") or "未実施"
          shops = data.get("shops", {})

          names = {
              "izuruya": "元祖手打そば いづるや",
              "ishiyama": "手打そば いしやま",
              "satoya": "そば処 さとや",
              "minshuku-izuru": "民宿いづる",
              "iwamotoya": "岩本屋",
              "fukumatsu": "福松",
              "fukujuya": "福寿屋",
              "yamabuki": "そば処 やまぶき"
          }

          updated = [
              (slug, info)
              for slug, info in shops.items()
              if info and info.get("updated")
          ]

          if updated:
              details = "".join(
                  f"<br>🆕 <b>{names.get(slug, slug)}</b>："
                  f"{info.get('summary', '公式ページに変更を検出しました。')}"
                  for slug, info in updated
              )

              box = f"""
          <!-- AUTO-UPDATE-STATUS:START -->
          <div style="margin:16px;padding:14px;background:#fff1ed;
                      border:1px solid #e2a99c;border-radius:14px;
                      font-size:13px;line-height:1.7;color:#6f352b;">
            <b>🆕 更新候補があります：{len(updated)}店</b>
            {details}
            <br><small>最終自動チェック：{checked}</small>
          </div>
          <!-- AUTO-UPDATE-STATUS:END -->
          """
          else:
              box = f"""
          <!-- AUTO-UPDATE-STATUS:START -->
          <div style="margin:16px;padding:14px;background:#edf5eb;
                      border:1px solid #c8dcc5;border-radius:14px;
                      font-size:13px;line-height:1.7;color:#315d42;">
            <b>✓ 自動更新チェック</b><br>
            現在、新しい更新候補はありません。<br>
            <small>最終自動チェック：{checked}</small>
          </div>
          <!-- AUTO-UPDATE-STATUS:END -->
          """

          if "</header>" in html:
              html = html.replace("</header>", "</header>" + box, 1)
          else:
              html = re.sub(r'(<body[^>]*>)', r'\1' + box, html, count=1)

          index.write_text(html, encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
